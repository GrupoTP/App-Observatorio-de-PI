# AppProject + Application do Observatório de PI (namespace observatorio, node a, a-ca).
# Este arquivo NÃO é sincronizado pelo ArgoCD: depois de alterar, aplicar no a-ca com
#   sudo k3s kubectl apply -f argocd/application.yaml
# Repo público: o ArgoCD lê via HTTPS sem credencial.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observatorio
  namespace: argocd
spec:
  description: Observatório de PI (portfólio Senac), cópia no a-ca.
  sourceRepos:
    - https://github.com/GrupoTP/App-Observatorio-de-PI.git
  destinations:
    - namespace: observatorio
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observatorio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observatorio
  source:
    repoURL: https://github.com/GrupoTP/App-Observatorio-de-PI.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: observatorio
  syncPolicy:
    # Sync automático ligado após a migração e o restore do dump (18/10/2026).
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
