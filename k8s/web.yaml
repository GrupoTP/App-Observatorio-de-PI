# Anexos do Observatório, no disco /data do node a (a-ca). O banco fica no MySQL do host a-ca.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: observatorio-anexos
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-data
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opi-web
spec:
  replicas: 1
  strategy:
    type: Recreate          # PVC de anexos é RWO
  selector:
    matchLabels:
      app: opi-web
  template:
    metadata:
      labels:
        app: opi-web
      annotations:
        polyclub.games/db: mysql-host-a-ca
    spec:
      nodeSelector:
        kubernetes.io/hostname: a
      # Imagem pública no ghcr.io: não precisa de imagePullSecrets.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z a.ca.node.polyclub.games 3306; do echo 'Aguardando o MySQL do a-ca...'; sleep 3; done"]
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits:   { memory: 32Mi }
      containers:
        - name: web
          image: ghcr.io/grupotp/app-observatorio-de-pi   # tag fixada no kustomization.yaml
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: opi-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: observatorio-mysql-credenciais, key: DB_PASSWORD }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: attachments
              mountPath: /var/www/html/storage/attachments
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: observatorio-anexos
---
apiVersion: v1
kind: Service
metadata:
  name: opi-web
spec:
  selector:
    app: opi-web
  ports:
    - name: http
      port: 80
      targetPort: http
