apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opi-attachments-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opi-web
spec:
  replicas: 1
  strategy:
    type: Recreate          # PVC de anexos é RWO
  selector:
    matchLabels:
      app: opi-web
  template:
    metadata:
      labels:
        app: opi-web
    spec:
      # PENDENTE: temp-br ainda não entrou no cluster (ver db.yaml).
      nodeSelector:
        kubernetes.io/hostname: temp-br
      tolerations:
        - key: polyclub.games/temp-br
          operator: Equal
          value: "true"
          effect: NoSchedule
      # Imagem pública no ghcr.io: não precisa de imagePullSecrets.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z opi-db 3306; do echo 'Aguardando MySQL...'; sleep 3; done"]
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits:   { memory: 32Mi }
      containers:
        - name: web
          image: ghcr.io/grupotp/app-observatorio-de-pi   # tag fixada no kustomization.yaml
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: opi-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: opi-db-credentials, key: DB_PASSWORD }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: attachments
              mountPath: /var/www/html/storage/attachments
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: opi-attachments-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: opi-web
spec:
  selector:
    app: opi-web
  ports:
    - name: http
      port: 80
      targetPort: http
