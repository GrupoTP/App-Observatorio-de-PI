apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opi-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - observatorio.grupotp.polyclub.com.br
      secretName: observatorio-tls
  rules:
    - host: observatorio.grupotp.polyclub.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opi-web
                port:
                  name: http
