# MySQL 8.4 dedicado ao Observatório.
# Sem /docker-entrypoint-initdb.d: o banco sobe vazio (só o database e o usuário)
# e os dados vêm de dump/restore da instância antiga (namespace senac).
# Para subir do zero sem dump: aplicar sql/schema/*.sql manualmente (ver README).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opi-db-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opi-db
spec:
  # 0 desde 18/10/2026: o Observatório usa o MySQL NATIVO do temp-br (ver configmap-app.yaml).
  # Mantido (com o PVC opi-db-pvc e o PV em Retain) só como rollback. Para voltar:
  # replicas: 1 aqui e DB_HOST: opi-db no ConfigMap (e o initContainer do web.yaml).
  replicas: 0
  strategy:
    type: Recreate          # PVC RWO: nunca dois MySQL no mesmo volume
  selector:
    matchLabels:
      app: opi-db
  template:
    metadata:
      labels:
        app: opi-db
    spec:
      # ── Agendamento no temp-br ────────────────────────────────────────────
      # PENDENTE: o temp-br ainda NÃO entrou no cluster. Até lá estes pods
      # ficam Pending. Conferir o nome real do node após o join
      # (kubectl get nodes) e ajustar o valor abaixo.
      nodeSelector:
        kubernetes.io/hostname: temp-br
      tolerations:
        - key: polyclub.games/temp-br
          operator: Equal
          value: "true"
          effect: NoSchedule
      # ──────────────────────────────────────────────────────────────────────
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - mysqld
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            # - --performance-schema=OFF   # opcional: economiza ~150 MB de RAM
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef: { name: opi-config, key: DB_NAME }
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef: { name: opi-config, key: DB_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: opi-db-credentials, key: DB_PASSWORD }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: opi-db-credentials, key: MYSQL_ROOT_PASSWORD }
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits:   { memory: 1Gi }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 --silent"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 --silent"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: opi-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: opi-db
spec:
  selector:
    app: opi-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
