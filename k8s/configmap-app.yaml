# Configuração NÃO secreta. A senha fica no SealedSecret observatorio-mysql-credenciais.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opi-config
data:
  APP_ENV: production
  APP_NAME: Observatório de Projetos Integradores
  # MySQL compartilhado do host a-ca (mysql.service), o mesmo dos apps do polyclub.
  # O usuário observatorio só aceita conexões vindas dos pods (10.42.0.%).
  DB_HOST: a.ca.node.polyclub.games
  DB_PORT: "3306"
  DB_NAME: observatorio
  DB_USER: observatorio
