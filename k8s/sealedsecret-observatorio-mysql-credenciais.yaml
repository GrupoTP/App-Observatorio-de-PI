# Só o controller sealed-secrets do cluster consegue abrir.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: observatorio-mysql-credenciais
  namespace: observatorio
spec:
  encryptedData:
    DB_PASSWORD: 
  template:
    metadata:
      creationTimestamp: null
      name: observatorio-mysql-credenciais
      namespace: observatorio
